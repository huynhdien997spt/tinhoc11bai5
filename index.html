
<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 5 – Kết nối máy tính với các thiết bị số</title>
<style>
:root{--b:#0ea5e9;--d:#0369a1;--c:#e0f7ff;--y:#fbbf24;--t:#0f172a;--g:#22c55e;--r:#ef4444}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:linear-gradient(#e0f7ff,#fff 320px);color:var(--t)}
header{position:sticky;top:0;background:#fff;box-shadow:0 2px 8px #0002;padding:8px 14px;z-index:5}
.hr{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.steps{display:flex;gap:6px;margin:6px 0}
.steps i{flex:1;text-align:center;padding:2px;border-radius:12px;background:#e2e8f0;font-style:normal;font-size:13px}
.steps i.on{background:var(--b);color:#fff}.steps i.ok{background:var(--g);color:#fff}
.bar{height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b),var(--y));transition:width .5s}
main{max-width:960px;margin:14px auto;padding:0 12px 90px}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 14px #0369a122;padding:16px;margin:12px 0}
h1{font-size:2.1em;text-align:center;color:var(--d);margin:.3em;line-height:1.2}
h2{color:var(--d);margin:.2em 0}
button,select,input,textarea{font:inherit}
.btn{background:var(--b);color:#fff;border:0;border-radius:24px;padding:10px 20px;cursor:pointer;font-weight:700;margin:4px}
.btn:hover{background:var(--d)}.btn:disabled{background:#94a3b8;cursor:not-allowed}
.btn.y{background:var(--y);color:#111}
.tag{font-size:12px;color:#64748b;background:none;border:0}
input,textarea,select{width:100%;padding:8px;border:2px solid #bae6fd;border-radius:10px;margin:4px 0}
.opt{display:block;width:100%;text-align:left;margin:5px 0;padding:9px 12px;border:2px solid #bae6fd;border-radius:10px;background:#fff;cursor:pointer}
.opt:hover{background:var(--c)}.opt.good{background:#dcfce7;border-color:var(--g)}
.opt.bad{background:#fee2e2;border-color:var(--r)}.opt:disabled{cursor:default}
.fb{margin-top:6px;font-weight:600;color:var(--d)}
.items,.zones{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.item{padding:10px 14px;background:var(--c);border:2px solid var(--b);border-radius:12px;cursor:grab;user-select:none;font-weight:600;touch-action:none}
.item[data-lock]{background:#dcfce7;border-color:var(--g);cursor:default}
.zone{flex:1;min-width:150px;min-height:110px;border:3px dashed var(--b);border-radius:14px;padding:8px;text-align:center;background:#f8fdff}
.ghost{position:fixed;pointer-events:none;z-index:99;opacity:.85}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pp .6s}@keyframes pp{50%{transform:scale(1.12);box-shadow:0 0 18px var(--y)}}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;font-weight:700}
.flow span{background:var(--c);padding:8px 12px;border-radius:10px;opacity:0;animation:fi .5s forwards}
@keyframes fi{to{opacity:1}}
.pc{background:#334155;border-radius:14px;padding:14px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.port{min-width:120px;min-height:66px;background:#0f172a;color:#fff;border:3px dashed #64748b;border-radius:8px;padding:6px;text-align:center;font-size:14px}
.port.ok{border:3px solid var(--g);background:#14532d}
.desk{position:relative;height:56px;background:#0f172a;border-radius:10px;overflow:hidden}
.dot{position:absolute;top:20px;left:4px;width:16px;height:16px;background:var(--y);border-radius:50%;transition:left .6s}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sim{background:#0f172a;color:#7dd3fc;border-radius:12px;padding:12px;font-family:monospace;min-height:64px}
.mm{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-top:8px}
.mm div{border-radius:10px;padding:8px;color:#fff;font-weight:700;font-size:14px}
nav.n{position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -2px 8px #0002;padding:8px;display:flex;justify-content:space-between;align-items:center;z-index:5}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #e2e8f0;padding:6px;text-align:left;font-size:14px}
.und button{font-size:15px;margin:3px;padding:8px 10px;border:2px solid #bae6fd;background:#fff;border-radius:12px;cursor:pointer}
.und button.on{background:var(--y);border-color:var(--y)}
@media(max-width:640px){.row,.mm{grid-template-columns:1fr}h1{font-size:1.5em}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.flow span{opacity:1}}
</style></head><body>
<header><div class="hr"><span>🔌 Bài 5</span><span id="xp"></span><span id="dm" class="tag"></span>
<button class="tag" onclick="openTeacher()">👨‍🏫 Teacher Mode</button></div>
<div id="st" hidden><div class="steps" id="sp"></div><div class="bar"><b id="pb"></b></div><div id="pt" class="tag"></div></div></header>
<main id="v"></main><nav class="n" id="nv" hidden></nav>
<script>
"use strict";
/* ===== CẤU HÌNH – GIÁO VIÊN CHỈNH TẠI ĐÂY ===== */
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxo1laO8YCyO8OyF7DqRko20Phj4txgHIslv_oPmaa8krRzjPWDiim37n-B7PU6czU3/exec";
const TEACHER_CODE = "GV2026";      // Mã Teacher Mode (chỉ là lớp bảo vệ giao diện cơ bản)
const TEACHER_NAME = "HUỲNH VĂN DIỄN";
const SHEET_URL = "https://docs.google.com/spreadsheets/d/1WDV22wAcsjYPfRzdpLeBXRYwlQGFZKTUloZw54P1CIQ/edit?usp=sharing";                       // Dán link Google Sheet (tuỳ chọn) để nút "Mở Google Sheets" hoạt động
const DEMO = GOOGLE_SCRIPT_URL.indexOf("PASTE_") === 0;

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/gi, "d").toLowerCase().replace(/[^a-z0-9]/g, "");
const keyOf = (n, c) => "lesson5_" + norm(c) + "_" + norm(n);   // StudentKey = bài + lớp + tên
// Nhiệm vụ từng phần: mỗi phần chiếm 20% tiến độ
const PARTS = [["sort", "usbq"], ["mouse", "monitor", "printer"], ["ports", "why"], ["pnp", "usb", "bt"], ["quiz", "exit"]];
let st = null, view = 1, pend = null, prevView = 1, bt = 0;
const Q = {};

/* ===== TIỆN ÍCH TRẠNG THÁI ===== */
const newState = (n, c) => ({ key: keyOf(n, c), name: n, cls: c, part: 1, done: {}, res: {}, xp: 0, start: new Date().toISOString(), exit: null, sort: {}, ports: {}, cop: 0, why: "" });
function pct(s) { s = s || st; let p = 0; PARTS.forEach(t => t.forEach(k => { if (s.done[k]) p += 20 / t.length })); return Math.round(p) }
function score(s) { s = s || st; let n = 0; for (let i = 0; i < 8; i++) { const r = s.res["qz" + i]; if (r && r.s) n++ } return Math.round(n / 8 * 100) / 10 }
function can(p) { const t = PARTS[p - 1], n = t.filter(k => st.done[k]).length; return p === 2 ? n >= 2 : n === t.length }
function api(action, data) {
  if (DEMO) return;
  try { fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ action }, data)) }).catch(() => {}) } catch (e) {}
}
function persist() {
  if (!st) return;
  st.last = new Date().toISOString();
  localStorage.setItem(st.key, JSON.stringify(st));
  api("saveProgress", { key: st.key, name: st.name, cls: st.cls, start: st.start, last: st.last, part: st.part, progress: pct(), score: score(), xp: st.xp, done: st.done.exit ? 1 : 0, state: JSON.stringify(st) });
}
function gain(n) { st.xp += n; hdr() }
function complete(k, xp) { if (st.done[k]) return; st.done[k] = 1; gain(xp || 20); persist(); hdr(); nav() }
function hdr() {
  $("#dm").textContent = DEMO ? "Demo Mode – dữ liệu đang lưu trên thiết bị." : "";
  const s = $("#st"); if (!st) { s.hidden = true; $("#xp").textContent = ""; return }
  s.hidden = false; const p = pct();
  $("#pb").style.width = p + "%"; $("#pt").textContent = "Tiến độ của em: " + p + "%"; $("#xp").textContent = "⭐ XP: " + st.xp;
  $("#sp").innerHTML = [1, 2, 3, 4, 5].map(i => `<i class="${view === i ? "on" : (PARTS[i - 1].every(k => st.done[k]) ? "ok" : "")}">${i}</i>`).join("");
}
function nav() {
  const n = $("#nv"); if (!st || typeof view !== "number") { n.hidden = true; return }
  n.hidden = false; const ok = can(view);
  n.innerHTML = `<button class="btn y" ${view < 2 ? "disabled" : ""} onclick="bk()">← Quay lại</button><span class="tag">${ok ? "Đã xong nhiệm vụ ✓" : "Hoàn thành nhiệm vụ để tiếp tục"}</span>` + (view < 5 ? `<button class="btn" ${ok ? "" : "disabled"} onclick="nx()">TIẾP TỤC →</button>` : "<span></span>");
}
function bk() { if (view > 1) { view--; st.part = view; render() } }
function nx() { if (!can(view)) return; view = view === 3 ? "cp" : view + 1; if (typeof view === "number") st.part = view; persist(); render() }

/* ===== KÉO THẢ (chuột + cảm ứng) ===== */
function drag(el, drop) {
  el.onpointerdown = e => {
    if (el.dataset.lock) return; e.preventDefault();
    const g = el.cloneNode(true); g.classList.add("ghost"); document.body.appendChild(g);
    const mv = x => { g.style.left = x.clientX - 30 + "px"; g.style.top = x.clientY - 20 + "px" }; mv(e);
    const up = x => {
      document.removeEventListener("pointermove", mv); document.removeEventListener("pointerup", up); g.remove();
      const t = document.elementFromPoint(x.clientX, x.clientY), z = t && t.closest("[data-zone]"); if (z) drop(el, z);
    };
    document.addEventListener("pointermove", mv); document.addEventListener("pointerup", up);
  };
}
const shake = e => { e.classList.remove("shake"); void e.offsetWidth; e.classList.add("shake") };

/* ===== CÂU HỎI TRẮC NGHIỆM CÓ GỢI Ý 2 MỨC ===== */
function mcq(id, act, q, opts, ok, hint, exp, cb) {
  Q[id] = { act, q, opts, ok, hint, exp, cb };
  return `<div class="q" id="q_${id}"><b>${q}</b>${opts.map((o, i) => `<button class="opt" onclick="pick('${id}',${i})">${o}</button>`).join("")}<div class="fb" id="fb_${id}"></div></div>`;
}
function pick(id, i) {
  const q = Q[id], r = st.res[id] = st.res[id] || { a: 0, ok: false, s: 0 };
  if (r.ok) return; r.a++;
  if (i === q.ok) return fin(id, i, r.a === 1, false);
  const b = $$("#q_" + id + " .opt")[i]; b.classList.add("bad"); b.disabled = true;
  if (r.a === 1) $("#fb_" + id).textContent = "Hãy xem lại: " + q.hint;
  else if (r.a === 2) $("#fb_" + id).textContent = "Gợi ý rõ hơn: em đã loại bớt đáp án sai. Đọc lại tình huống và thử lần nữa nhé!";
  else fin(id, q.ok, false, true);
}
function fin(id, i, first, rev) {
  const q = Q[id], r = st.res[id]; r.ok = true; r.s = first ? 1 : 0;
  $$("#q_" + id + " .opt")[i].classList.add("good"); $$("#q_" + id + " .opt").forEach(b => b.disabled = true);
  $("#fb_" + id).textContent = (rev ? "Đáp án đúng: " : "✓ Chính xác! +" + (first ? 10 : 5) + " XP. ") + q.exp;
  gain(first ? 10 : 5);
  api("saveResponse", { key: st.key, name: st.name, cls: st.cls, activity: q.act, question: q.q, answer: q.opts[i], correct: 1, attempts: r.a, score: r.s });
  persist(); if (q.cb) q.cb();
}
function restoreQ() { Object.keys(Q).forEach(id => { const r = st.res[id], e = $("#q_" + id); if (r && r.ok && e) { $$("#q_" + id + " .opt").forEach(b => b.disabled = true); $$("#q_" + id + " .opt")[Q[id].ok].classList.add("good"); $("#fb_" + id).textContent = "✓ " + Q[id].exp } }) }

/* ===== MÀN HÌNH CHÀO / TIẾP TỤC ===== */
function welcome() {
  return `<div class="card" style="text-align:center"><h1>BÀI 5<br>KẾT NỐI MÁY TÍNH<br>VỚI CÁC THIẾT BỊ SỐ</h1>
<p>👨‍🏫 Giáo viên: ${TEACHER_NAME}<br>⏱ Thời lượng: 2 tiết – 90 phút</p>
<p><i>“Máy tính có thể kết nối với rất nhiều thiết bị.<br>Nhưng liệu em có biết phải cắm chúng vào đâu?”</i></p>
<div style="max-width:360px;margin:auto"><input id="nm" placeholder="Họ và tên (vd: Nguyễn Văn An)"><input id="cl" placeholder="Lớp (vd: 10A1)">
<div class="fb" id="we" style="color:var(--r)"></div><div id="wc"><button class="btn" onclick="start()">🚀 BẮT ĐẦU BÀI HỌC</button></div></div></div>`;
}
async function start() {
  const n = $("#nm").value.trim().replace(/\s+/g, " "), c = $("#cl").value.trim().toUpperCase();
  if (n.length < 2 || !c) { $("#we").textContent = "Em hãy nhập đầy đủ Họ và tên và Lớp nhé!"; return }
  const k = keyOf(n, c); let s = null;
  try { s = JSON.parse(localStorage.getItem(k)) } catch (e) {}
  if (!s && !DEMO) { try { const r = await (await fetch(GOOGLE_SCRIPT_URL + "?action=getStudentProgress&key=" + encodeURIComponent(k))).json(); if (r.ok && r.found) s = JSON.parse(r.state) } catch (e) {} }
  if (!s) return begin(newState(n, c), true);
  pend = s;
  $("#wc").innerHTML = `<h2>Chào mừng ${s.name} quay trở lại!</h2><p>Em đã hoàn thành ${pct(s)}% bài học.</p><button class="btn" onclick="begin(pend,false)">▶ TIẾP TỤC BÀI HỌC</button><button class="btn y" onclick="begin(newState(pend.name,pend.cls),true)">🔄 HỌC LẠI TỪ ĐẦU</button>`;
}
function begin(s, fresh) {
  st = s; if (fresh) api("registerStudent", { key: st.key, name: st.name, cls: st.cls, start: st.start });
  persist(); view = st.done.exit ? "done" : st.part; render();
}

/* ===== PHẦN 1 – KHỞI ĐỘNG ===== */
const D = [["⌨️", "Bàn phím", "in", "Bàn phím gửi phím em gõ vào máy tính."], ["🖱", "Chuột", "in", "Chuột gửi thao tác di chuyển, bấm vào máy tính."], ["🖥", "Màn hình", "out", "Màn hình nhận hình ảnh từ máy tính để hiển thị."], ["🖨", "Máy in", "out", "Máy in nhận dữ liệu từ máy tính rồi in ra giấy."], ["📷", "Camera", "in", "Camera thu hình ảnh và đưa vào máy tính."], ["🎤", "Micro", "in", "Micro thu âm thanh đưa vào máy tính."], ["📽", "Máy chiếu", "out", "Máy chiếu đưa hình từ máy tính ra màn chiếu."], ["💾", "USB", "both", "Ổ USB vừa lưu dữ liệu vào, vừa đọc dữ liệu ra."]];
const wr = {};
function p1() {
  return `<div class="card"><h2>🔌 “Thiết bị này làm gì?”</h2><p>Kéo từng thiết bị vào đúng khu vực. Hãy nghĩ: dữ liệu đang đi <b>vào</b> hay đi <b>ra</b> khỏi máy tính?</p>
<div class="items" id="it"></div><div class="zones"><div class="zone" data-zone="in">⬇ THIẾT BỊ VÀO</div><div class="zone" data-zone="out">⬆ THIẾT BỊ RA</div><div class="zone" data-zone="both">↕ VÀO + RA</div></div><div class="fb" id="sfb"></div></div>
<div id="flow" hidden><div class="card"><div class="flow"><span>🌍 THẾ GIỚI THẬT</span>↓<span style="animation-delay:.5s">⬇ THIẾT BỊ VÀO</span>↓<span style="animation-delay:1s">💻 MÁY TÍNH</span>↓<span style="animation-delay:1.5s">⬆ THIẾT BỊ RA</span>↓<span style="animation-delay:2s">🧑 CON NGƯỜI</span></div></div>
<div class="card">${mcq("usbq", "P1", "USB chỉ là thiết bị vào hay chỉ là thiết bị ra?", ["Chỉ là thiết bị vào", "Chỉ là thiết bị ra", "Có thể vừa vào vừa ra, tuỳ thiết bị"], 2, "Ổ USB có thể ghi dữ liệu vào và đọc dữ liệu ra, còn chuột USB chỉ gửi dữ liệu vào.", "Cổng USB dùng cho nhiều thiết bị; ổ USB trao đổi dữ liệu hai chiều.", () => complete("usbq"))}</div></div>`;
}
function initSort() {
  D.forEach(d => {
    const e = document.createElement("div"); e.className = "item"; e.textContent = d[0] + " " + d[1]; e.dataset.n = d[1];
    if (st.sort[d[1]]) { e.dataset.lock = 1; $('[data-zone="' + d[2] + '"]').appendChild(e) } else { $("#it").appendChild(e); drag(e, dropSort) }
  }); sortDone();
}
function dropSort(el, z) {
  const d = D.find(x => x[1] === el.dataset.n), f = $("#sfb");
  if (d[2] === z.dataset.zone) { z.appendChild(el); el.dataset.lock = 1; st.sort[d[1]] = 1; gain(10); f.textContent = "✓ Chính xác! +10 XP"; el.classList.add("pop"); persist(); sortDone() }
  else { wr[d[1]] = (wr[d[1]] || 0) + 1; shake(z); f.textContent = wr[d[1]] < 2 ? "Hãy suy nghĩ: dữ liệu đang đi vào hay đi ra khỏi máy tính?" : "Gợi ý: " + d[3] }
}
function sortDone() { if (D.every(d => st.sort[d[1]])) { $("#flow").hidden = false; complete("sort") } }

/* ===== PHẦN 2 – PHÒNG THÍ NGHIỆM THIẾT BỊ SỐ ===== */
const PR1 = [["Hóa đơn ở siêu thị", "Máy in nhiệt"], ["Tài liệu văn phòng", "Máy in laser"], ["Ảnh màu", "Máy in phun"], ["Hóa đơn nhiều liên", "Máy in kim"]];
const PR2 = [["DPI", "Độ nét khi in"], ["PPM", "Số trang in mỗi phút"], ["A4", "Khổ giấy"], ["Color", "Khả năng in màu"], ["USB / Wi-Fi", "Phương thức kết nối"]];
function match(id, rows) {
  const o = rows.map(r => r[1]).reverse(), d = st.done["m_" + id];
  return rows.map((r, i) => `<div class="row" style="align-items:center"><b>${r[0]}</b><select data-a="${r[1]}" ${d ? "disabled" : ""}><option value="">– chọn –</option>${o.map(x => `<option ${d && x === r[1] ? "selected" : ""}>${x}</option>`).join("")}</select></div>`).join("") + `<button class="btn" onclick="chk('${id}')">Kiểm tra</button><span class="fb" id="mf_${id}"></span>`;
}
function chk(id) {
  const box = $("#mb_" + id); let bad = 0;
  $$("#mb_" + id + " select").forEach(s => { const ok = s.value === s.dataset.a; s.style.borderColor = ok ? "var(--g)" : "var(--r)"; if (!ok) bad++ });
  $("#mf_" + id).textContent = bad ? "Còn " + bad + " ô chưa đúng. Hãy đọc lại tên và ý nghĩa rồi thử lại." : "✓ Ghép đúng hết!";
  if (!bad && !st.done["m_" + id]) { st.done["m_" + id] = 1; gain(10); persist() }
  if (st.done.m_p1 && st.done.m_p2) complete("printer");
}
function p2() {
  return `<div class="card"><h2>🧪 Phòng thí nghiệm thiết bị số</h2><p>Hoàn thành ít nhất 2 trong 3 trạm để đi tiếp.</p></div>
<div class="card"><h2>Trạm 1 – 🖱 Chuột</h2><div class="desk"><div class="dot" id="dot"></div></div>
<p>Tốc độ / DPI: <b id="dpi">≈ 1200 DPI</b></p><input type="range" min="1" max="10" value="3" oninput="mvDot(this.value)"><div class="tag">Chậm ←──────→ Nhanh (cùng một quãng di chuyển chuột, con trỏ chạy xa hơn khi DPI cao)</div>
${mcq("mouse", "P2-Mouse", "Em đang chỉnh một chi tiết rất nhỏ trong bức ảnh. Em nên chọn tốc độ chuột thế nào?", ["Rất nhanh", "Vừa hoặc chậm để dễ điều khiển", "Tốc độ nào cũng giống nhau"], 1, "DPI cao không phải lúc nào cũng tốt. Thao tác chính xác cần gì?", "Tốc độ vừa hoặc chậm giúp điều khiển chính xác; DPI cao khiến con trỏ dễ “nhảy” quá đà.", () => complete("mouse"))}</div>

  return `<div class="card" style="text-align:center"><h1>🎉 HOÀN THÀNH BÀI 5</h1><h2>${st.name} – Lớp ${st.cls}</h2><p>Tiến độ: <b>${pct()}%</b> · Điểm quiz: <b>${score()}/10</b> · ⭐ XP: <b>${st.xp}</b></p>
<p>✓ Thiết bị vào – ra<br>✓ Thông số thiết bị<br>✓ VGA / HDMI / USB / Ethernet<br>✓ Plug & Play<br>✓ USB<br>✓ Bluetooth<br>✓ Mindmap</p>
<p><i>“Hôm nay em không chỉ học cách cắm dây. Em đã học cách lựa chọn đúng thiết bị và đúng phương thức kết nối.”</i></p>
<button class="btn" onclick="$('#gd').hidden=!$('#gd').hidden">🧠 XEM LẠI HƯỚNG DẪN MINDMAP</button><button class="btn y" onclick="view=1;st.part=1;render()">📚 ÔN TẬP</button><div id="gd" hidden style="text-align:left">${guide()}</div></div>`;
}

/* ===== TEACHER MODE ===== */
function openTeacher() { if (prompt("Nhập mã giáo viên:") !== TEACHER_CODE) return; if (typeof view === "number" || view === "cp" || view === "done") prevView = view; view = "t"; teacher() }
async function teacher() {
  $("#nv").hidden = true; const m = $("#v"); m.innerHTML = `<div class="card">Đang tải dữ liệu...</div>`; let rows = [];
  if (DEMO) { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.indexOf("lesson5_") === 0) { try { const s = JSON.parse(localStorage.getItem(k)); rows.push({ name: s.name, cls: s.cls, progress: pct(s), score: score(s), xp: s.xp, done: !!s.done.exit, exit: !!s.done.exit, und: s.exit ? s.exit.und : 0 }) } catch (e) {} } } }
  else { try { const r = await (await fetch(GOOGLE_SCRIPT_URL + "?action=getTeacherData")).json(); rows = r.students || [] } catch (e) { m.innerHTML = `<div class="card">Không tải được dữ liệu. Kiểm tra lại URL Apps Script.</div>` } }
  window.TR = rows; drawT();
}
function drawT() {
  const rows = window.TR, cf = ($("#fc") || {}).value || "", sf = ($("#fs") || {}).value || "", cls = [...new Set(rows.map(r => r.cls))].sort();
  const f = rows.filter(r => (!cf || r.cls === cf) && (!sf || (sf === "done") === !!r.done)), n = f.length || 1, avg = k => (f.reduce((a, r) => a + (+r[k] || 0), 0) / n).toFixed(1);
  const ex = f.filter(r => r.exit), au = ex.length ? (ex.reduce((a, r) => a + (+r.und || 0), 0) / ex.length).toFixed(1) : "–";
  $("#v").innerHTML = `<div class="card"><button class="btn y" onclick="view=prevView;render()">← Quay lại</button><h2>👨‍🏫 Teacher Mode</h2>
<p>Tổng học sinh: <b>${f.length}</b> · Đã hoàn thành: <b>${f.filter(r => r.done).length}</b> · Đang học: <b>${f.filter(r => !r.done).length}</b> · Tiến độ TB: <b>${Math.round(avg("progress"))}%</b> · Điểm TB: <b>${avg("score")}/10</b> · Exit Ticket: <b>${ex.length}/${f.length}</b> · Mức hiểu TB: <b>${au}/5</b></p>
<div class="row"><select id="fc" onchange="drawT()"><option value="">Lớp: Tất cả</option>${cls.map(c => `<option ${c === cf ? "selected" : ""}>${c}</option>`).join("")}</select><select id="fs" onchange="drawT()"><option value="">Trạng thái: Tất cả</option><option value="doing" ${sf === "doing" ? "selected" : ""}>Đang học</option><option value="done" ${sf === "done" ? "selected" : ""}>Hoàn thành</option></select></div>
<button class="btn" onclick="teacher()">🔄 TẢI LẠI DỮ LIỆU</button><button class="btn y" onclick="SHEET_URL?window.open(SHEET_URL):alert('Chưa dán SHEET_URL trong index.html')">📊 MỞ GOOGLE SHEETS</button>
<div style="overflow-x:auto"><table><tr><th>Họ tên</th><th>Lớp</th><th>Tiến độ</th><th>Điểm</th><th>XP</th><th>Exit Ticket</th></tr>${f.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.cls)}</td><td>${r.progress}%</td><td>${r.score}</td><td>${r.xp}</td><td>${r.exit ? "✓" : "–"}</td></tr>`).join("")}</table></div></div>`;
}
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ===== VẼ GIAO DIỆN ===== */
function render() {
  const v = $("#v");
  if (!st) { v.innerHTML = welcome(); hdr(); nav(); return }
  v.innerHTML = view === "cp" ? cpH() : view === "done" ? doneH() : [0, p1, p2, p3, p4, p5][view]();
  if (view === 1) initSort(); if (view === 2) { px(2); ["p1", "p2"].forEach(x => 0) } if (view === 3) initPorts();
  if (view === 4) { initBt(); if (st.done.usb) cam() } if (view === 5) { qzCb() }
  restoreQ(); hdr(); nav(); scrollTo(0, 0);
}
render();
</script></body></html>
